# Konfigurasi Nginx Reverse Proxy untuk DokumenMaker (LLM-RAB-RKS)
# Letakkan di: /etc/nginx/sites-available/dokumenmaker.conf
# Lalu symlink ke: /etc/nginx/sites-enabled/dokumenmaker.conf

server {
    listen 80;
    server_name _; # Ganti dengan domain kantor (contoh: dokumen.kantor.co.id) atau IP VPS

    # Batas ukuran upload dokumen PDF (default Nginx 1MB terlalu kecil untuk PDF berhalaman banyak)
    client_max_body_size 100M;

    # Gzip Compression untuk performa loading frontend cepat
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. Routing Frontend SPA (Single Page Application)
    # Ganti path root sesuai lokasi build frontend di VPS Anda
    root /var/www/dokumenmaker/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse Proxy ke Backend FastAPI (Internal Loopback 127.0.0.1:8090)
    # Port 8090 TIDAK PERLU dibuka di firewall (UFW) karena hanya Nginx internal yang mengaksesnya.
    location /api/ {
        proxy_pass http://127.0.0.1:8090/api/;
        proxy_http_version 1.1;

        # Header forwarding agar FastAPI tahu host asli dan IP client
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout panjang untuk proses ekstraksi OCR & LLM yang memakan waktu
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;

        # Disable buffering untuk respons streaming / polling yang lancar
        proxy_buffering off;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://127.0.0.1:8090/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Cache static assets (CSS, JS, Fonts, Images)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }
}
